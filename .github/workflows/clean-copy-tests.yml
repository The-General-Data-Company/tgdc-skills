name: clean-copy-tests
on:
  push:
    paths:
      - 'skills/tgdc-clean-copy/**'
      - '.github/workflows/clean-copy-tests.yml'
  pull_request:
    paths:
      - 'skills/tgdc-clean-copy/**'
      - '.github/workflows/clean-copy-tests.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: skills/tgdc-clean-copy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Tesseract
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr ;;
            macOS) HOMEBREW_NO_AUTO_UPDATE=1 brew install tesseract ;;
            Windows) choco install tesseract -y --no-progress && ls "/c/Program Files/Tesseract-OCR/tesseract.exe" ;;
          esac
      - name: Python packages
        run: python -m pip install --index-url https://pypi.org/simple --requirement assets/requirements.txt
      - name: Tests
        env:
          PYTHONUTF8: '0'                 # the system default encoding, as the operator's machine has it
        run: python -m unittest discover -s tests -v
      - name: README install steps in Windows PowerShell
        if: runner.os == 'Windows' && matrix.python == '3.14'
        shell: powershell
        working-directory: .
        run: |
          sh scripts/build_release.sh tgdc-clean-copy
          Set-Location dist
          $V = (Get-ChildItem tgdc-clean-copy-v*.tar.gz).Name -replace '^tgdc-clean-copy-(v.*)\.tar\.gz$', '$1'
          $expected = (@(Get-Content SHA256SUMS) -match "tgdc-clean-copy-$V.tar.gz")[0].Split(" ")[0]
          if ((Get-FileHash "tgdc-clean-copy-$V.tar.gz" -Algorithm SHA256).Hash -ne $expected) { throw "Checksum mismatch" } else {
            New-Item -ItemType Directory -Force unpacked | Out-Null; tar -xzf "tgdc-clean-copy-$V.tar.gz" -C unpacked }
          if (-not (Test-Path unpacked/tgdc-clean-copy/scripts/id_signals.py)) { throw "The skill was not unpacked" }
          Write-Output "README steps verified for $V"
